name: Quotex Telegram Bot

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '*/5 * * * *' # Har 5 minute mein check karega

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install requests pandas numpy websocket-client

    - name: Run Quotex Bot
      env:
        QUOTEX_EMAIL: ${{ secrets.QUOTEX_EMAIL }}
        QUOTEX_PASSWORD: ${{ secrets.QUOTEX_PASSWORD }}
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python main.py
      
