name: Quotex OTC Future Engine

on:
  schedule:
    - cron: '*/5 * * * *' # Yeh har 5 minute me background network ko trigger karega
  workflow_dispatch: # Manual run button

jobs:
  run-predictive-matrix:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install Modules
      run: |
        pip install -r requirements.txt
    - name: Run Future Predictor Engine
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python main.py
      
